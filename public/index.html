<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1710"><title>Jungle Treasure Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800;9..144,900&family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --moss:#1f4a33; --deep:#0b1c14; --canopy:#2f6b3f; --leaf:#8cc860; --brass:#d9a441; --brass-hi:#ffd98a; --brass-lo:#9a6a1c;
  --amber:#ffcf6b; --parch:#f3e6c4; --parch-dim:#cdbf9a; --clay:#8a5a35; --ink:#0a1510; --bad:#ff8f73;
  --panel-a:rgba(14,36,26,.78); --panel-b:rgba(7,21,14,.86); --edge:rgba(217,164,65,.5); --text:#f6efd9; --muted:#b9c4a8;
  --display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif; --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --text:#f6efd9; } }
:root[data-theme="dark"]{ --text:#f6efd9; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;-webkit-text-size-adjust:100%}
html.large{font-size:19px}
body{height:100%;margin:0;background:radial-gradient(120% 80% at 50% 0,#173a28,#07120c 70%);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#0a1710;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 80px rgba(0,0,0,.6)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#app{position:absolute;inset:0;pointer-events:none}
.hidden{display:none!important}
.hc .panel{background:#06120c;border-color:#ffd98a}
.hc{--muted:#e6ecd9}

/* ---------- primitives ---------- */
.panel{pointer-events:auto;background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--edge);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,236,180,.14);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.btn{pointer-events:auto;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.7rem 1.2rem;border-radius:14px;font-weight:800;font-size:1rem;letter-spacing:.02em;color:#2b1a05;background:linear-gradient(180deg,#ffe3a0 0%,#f0b84a 48%,#cf8f25 100%);box-shadow:0 3px 0 var(--brass-lo),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .12s,box-shadow .12s,filter .2s}
.btn:active:not(:disabled){transform:translateY(3px) scale(.985);box-shadow:0 0 0 var(--brass-lo),0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.btn.ghost{color:var(--text);background:linear-gradient(180deg,rgba(24,56,40,.82),rgba(9,26,17,.9));border:1px solid var(--edge);box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,236,180,.12);font-weight:700}
.btn.small{min-height:44px;padding:.5rem .9rem;font-size:.92rem}
.btn.big{min-height:60px;font-size:1.18rem;border-radius:16px;width:100%}
.btn svg{width:1.4em;height:1.4em;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.005em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:.6rem}
.grow{flex:1;min-width:0}
.scr{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;animation:scrIn .32s ease-out both}
@keyframes scrIn{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}
.scr.out{animation:scrOut .22s ease-in both}
@keyframes scrOut{to{opacity:0;transform:scale(.985)}}
.scrim{background:linear-gradient(180deg,rgba(4,14,9,.72) 0%,rgba(4,14,9,.38) 32%,rgba(4,14,9,.62) 64%,rgba(4,14,9,.9) 100%)}
.pad{padding:calc(14px) 16px 16px}
.topbar{display:flex;align-items:center;gap:.6rem;padding:12px 14px}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem}
.title{font-size:1.45rem;font-weight:800}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0;height:0}
.tag{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .55rem;border-radius:99px;background:rgba(255,217,138,.14);border:1px solid rgba(255,217,138,.35);font-size:.78rem;font-weight:700;color:var(--brass-hi)}

/* ---------- splash & logo ---------- */
#splash{position:absolute;inset:0;z-index:50;pointer-events:auto;background:#030805;display:grid;place-items:center;transition:opacity .6s}
#splash.off{opacity:0;pointer-events:none}
#splash .leafs{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 55%,rgba(255,200,90,.22),transparent 70%);animation:glowIn 2.2s ease-out both}
@keyframes glowIn{from{opacity:0;transform:scale(.6)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
#splash .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:.85rem;opacity:.7}
.logo{text-align:center;position:relative}
.logo .gem{width:78px;height:78px;filter:drop-shadow(0 0 18px rgba(255,200,90,.65));animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.logo .t1{font-family:var(--display);font-weight:900;font-size:3.5rem;line-height:.9;letter-spacing:.01em;font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1;background:linear-gradient(180deg,#fff2c4 0%,#ffcf6b 45%,#c98a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3a0a) drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.logo .t2{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:.06em;margin-top:.15rem;color:var(--parch);text-shadow:0 2px 0 #3a2a0c,0 4px 14px rgba(0,0,0,.7)}
.logo .tag2{font-family:var(--display);font-style:italic;font-weight:500;margin-top:.55rem;color:#f1e3b8;font-size:1.02rem;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.splash-logo .gem{animation:gemIn 1.3s .5s cubic-bezier(.2,1.2,.3,1) both}
.splash-logo .t1,.splash-logo .t2,.splash-logo .tag2{animation:fadeUp .9s 1.2s both}
.splash-logo .t2{animation-delay:1.4s}.splash-logo .tag2{animation-delay:1.7s}
@keyframes gemIn{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.home{justify-content:space-between}
.home .top{padding:calc(12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pchip{pointer-events:auto;display:flex;align-items:center;gap:.55rem;padding:.35rem .8rem .35rem .35rem;border-radius:99px;min-height:48px}
.pchip .lv{font-size:.74rem;color:var(--brass-hi);font-weight:800}
.pchip .nm{font-weight:800;font-size:.95rem;line-height:1.1;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpbar{height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:3px;width:100%}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe28a,#e8a93a);border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.streak{pointer-events:auto;padding:.45rem .8rem;border-radius:99px;font-weight:800;font-size:.88rem}
.home .logo-wrap{margin-top:5vh;position:relative}
.home .logo-wrap::before{content:"";position:absolute;left:50%;top:44%;width:340px;height:260px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,196,80,.3),transparent);animation:pulseGlow 4.5s ease-in-out infinite;pointer-events:none}
@keyframes pulseGlow{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.12)}}
.menu{padding:0 16px calc(18px);display:flex;flex-direction:column;gap:10px}
.menu .play{min-height:72px;font-size:1.6rem;font-family:var(--display);font-weight:900;border-radius:18px;letter-spacing:.04em;animation:idle 3.2s ease-in-out infinite}
@keyframes idle{50%{transform:scale(1.018);filter:brightness(1.08)}}
.daily-card{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;text-align:left;width:100%}
.daily-card .ico{font-size:1.9rem}
.daily-card b{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{justify-content:flex-start;padding-left:.9rem}
.stagger>*{animation:fadeUp .5s both}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.16s}.stagger>*:nth-child(4){animation-delay:.24s}

/* ---------- setup / lobby ---------- */
.sheet{margin:0;flex:1;display:flex;flex-direction:column;min-height:0}
.sec{margin:0 16px 14px}
.sec h3{font-size:1.02rem;margin:0 0 .5rem;color:var(--parch)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scroll-snap-type:x proximity}
.modecard{flex:0 0 150px;scroll-snap-align:start;text-align:left;padding:.75rem;border-radius:14px;position:relative;min-height:112px;border:1.5px solid rgba(217,164,65,.28);background:linear-gradient(160deg,rgba(32,70,50,.9),rgba(9,26,17,.92));transition:transform .15s,border-color .15s}
.modecard[aria-pressed=true]{border-color:var(--brass-hi);box-shadow:0 0 0 2px rgba(255,217,138,.25),0 10px 20px rgba(0,0,0,.4);transform:translateY(-2px)}
.modecard .mi{font-size:1.5rem}.modecard b{display:block;margin:.2rem 0 .1rem;font-size:.98rem}.modecard small{color:var(--muted);line-height:1.25;display:block;font-size:.78rem}
.modecard.lock{opacity:.5}
.pcard{display:flex;align-items:center;gap:.6rem;padding:.55rem;border-radius:14px;margin-bottom:8px;animation:walkIn .5s both;position:relative}
@keyframes walkIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.pcard .av{position:relative;width:52px;height:52px;border-radius:50%;flex:none;border:3px solid var(--c,#d9a441);background:#0c1f16;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.pcard .av svg{width:100%;height:100%;display:block}
.pcard input{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:var(--text);font:inherit;font-weight:700;padding:.5rem .65rem;min-height:44px;user-select:text;-webkit-user-select:text}
.pcard .meta{font-size:.74rem;color:var(--muted);margin-top:2px;display:flex;gap:.4rem;align-items:center}
.pcard .ready{position:absolute;right:10px;top:50%;transform:translateY(-50%) scale(0);background:#3fbf7a;color:#052;font-weight:900;border-radius:99px;padding:.2rem .6rem;font-size:.8rem;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.pcard.rdy .ready{transform:translateY(-50%) scale(1)}
.pcard.rdy{border-color:#3fbf7a}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:.4rem .85rem;border-radius:12px;border:1.5px solid rgba(217,164,65,.3);background:rgba(8,24,16,.75);font-weight:700;font-size:.9rem}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ffe3a0,#e5a93d);color:#2b1a05;border-color:#fff1c4}
.seg button.lock{opacity:.45}
.mini{min-width:44px;min-height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);font-size:1.05rem}
.footbar{padding:12px 16px calc(14px);background:linear-gradient(180deg,transparent,rgba(4,14,9,.95) 38%)}
.sel-av{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sel-av button{aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid transparent;background:#0c1f16;position:relative}
.sel-av button[aria-pressed=true]{border-color:var(--brass-hi);box-shadow:0 0 14px rgba(255,217,138,.5)}
.sel-av button svg{width:100%;height:100%}
.sel-av span{display:block;font-size:.7rem;text-align:center;margin-top:3px;color:var(--muted)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;left:10px;right:10px;top:10px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:stretch}
.hud-btn{pointer-events:auto;width:48px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem}
.hud-cell{pointer-events:none;padding:.32rem .6rem;border-radius:14px;line-height:1.1;min-width:0}
.hud-cell small{display:block;font-size:.68rem;color:var(--muted);font-weight:600}
.hud-cell b{font-size:1.12rem;font-weight:900;font-family:var(--display);display:block;white-space:nowrap}
.hud-cell.c{text-align:center}.hud-cell.r{text-align:right}
.bump{animation:bump .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.28)}}
.final{color:#ffb86b!important;animation:finalPulse 1.4s ease-in-out infinite}
@keyframes finalPulse{50%{text-shadow:0 0 16px rgba(255,150,60,.9)}}
.hud-score{position:absolute;left:10px;right:10px;top:66px;display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding:2px 0}
.hud-score::-webkit-scrollbar{display:none}
.schip{flex:0 0 auto;display:flex;align-items:center;gap:.35rem;padding:.2rem .6rem .2rem .2rem;border-radius:99px;background:rgba(7,21,14,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(5px);min-height:36px;font-weight:800;font-size:.86rem;transition:all .3s}
.schip .av{width:28px;height:28px;border-radius:50%;overflow:hidden;border:2px solid var(--c);background:#0c1f16;flex:none}
.schip .av svg{width:100%;height:100%;display:block}
.schip.act{border-color:var(--brass-hi);background:rgba(60,44,10,.7);box-shadow:0 0 0 2px rgba(255,217,138,.28),0 0 18px rgba(255,200,90,.3)}
.schip .sc{color:var(--brass-hi);min-width:1.1em;text-align:right;font-variant-numeric:tabular-nums}
.hud-bottom{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 10px 10px;display:flex;flex-direction:column;gap:8px;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s}
.hud-bottom.off{transform:translateY(130%);opacity:0}
.turn{display:flex;align-items:center;gap:.65rem}
.turn .av{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid var(--c);flex:none;background:#0c1f16;box-shadow:0 0 0 3px rgba(255,217,138,.25),0 0 18px rgba(255,200,90,.35);animation:avPulse 2.4s ease-in-out infinite}
.turn .av svg{width:100%;height:100%;border-radius:50%;display:block}
@keyframes avPulse{50%{box-shadow:0 0 0 5px rgba(255,217,138,.15),0 0 26px rgba(255,200,90,.5)}}
.turn .who{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn .sub{font-size:.8rem;color:var(--muted)}
.turn .score{margin-left:auto;text-align:right;font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1;color:var(--brass-hi);font-variant-numeric:tabular-nums;position:relative}
.turn .score small{display:block;font-family:var(--ui);font-size:.68rem;color:var(--muted);font-weight:600}
.floatplus{position:absolute;right:0;top:-26px;font-family:var(--display);font-weight:900;font-size:1.7rem;color:#ffe28a;text-shadow:0 2px 0 #7a4b08,0 0 16px rgba(255,200,80,.9);animation:floatUp 1.5s ease-out both;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translateY(14px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-40px)}}
.pickline{font-weight:800;text-align:center;min-height:1.4em;font-size:1rem;letter-spacing:.01em}
.pickline.sel{color:var(--brass-hi);animation:selPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes selPop{from{transform:scale(.85);opacity:.4}}
.picker{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity;mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.picker::-webkit-scrollbar{display:none}
.chip{flex:0 0 46px;height:46px;position:relative;scroll-snap-align:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));transition:transform .18s,filter .2s}
.chip .sh,.chip .sh::after{clip-path:var(--clip)}
.chip .sh{position:absolute;inset:2px;background:#2e2112}
.chip .sh::after{content:"";position:absolute;inset:2.5px;background:var(--parch)}
.chip[data-s="0"]{--clip:circle(50%)}.chip[data-s="1"]{--clip:inset(0 round 28%)}.chip[data-s="2"]{--clip:polygon(50% 2%,99% 94%,1% 94%)}
.chip[data-s="3"]{--clip:polygon(50% 0,100% 50%,50% 100%,0 50%)}.chip[data-s="4"]{--clip:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}.chip[data-s="5"]{--clip:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.chip b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.98rem;color:#2a1b08;z-index:1}
.chip[data-s="2"] b{padding-top:9px}.chip[data-s="5"] b{padding-bottom:6px}
.chip[aria-pressed=true]{transform:scale(1.14);filter:drop-shadow(0 0 9px rgba(255,205,90,.95))}
.chip[aria-pressed=true] .sh::after{background:linear-gradient(180deg,#ffe9a8,#f0b23c)}
.chip.seen .sh::after{background:#5a5446}.chip.seen b{color:#cfc6ae}
.chip.seen::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#ff8f73;font-weight:900;font-size:1.05rem;z-index:2;text-shadow:0 0 3px #000}
.hud-bottom.locked .picker,.hud-bottom.locked .turn .sub{opacity:.55;pointer-events:none}
.hud-bottom.locked .chip{pointer-events:none}
.timer{height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9a5a,#ffd35a);transform-origin:left;}
.trackbtn{min-height:60px;font-size:1.15rem}
.trackbtn .ic{font-size:1.4rem}

/* ---------- banners & overlays ---------- */
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
.bn{text-align:center;padding:1.1rem 1.6rem;border-radius:20px;background:linear-gradient(180deg,rgba(14,36,26,.9),rgba(6,18,12,.92));border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(255,200,90,.18);backdrop-filter:blur(8px);max-width:88%;animation:bnIn .38s cubic-bezier(.2,1.4,.4,1) both}
.bn.out{animation:bnOut .28s ease-in both}
.bn.win{border-color:#ffe28a;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 80px rgba(255,200,90,.5)}
.bn.mini{padding:.7rem 1.3rem;background:rgba(10,26,18,.82)}
@keyframes bnIn{from{opacity:0;transform:scale(.7) translateY(16px)}}
@keyframes bnOut{to{opacity:0;transform:scale(.92) translateY(-10px)}}
.bn h2{font-size:1.9rem;font-weight:900;line-height:1.05;color:var(--brass-hi);text-shadow:0 2px 0 #5a3a0a}
.bn.fail h2{color:var(--parch);font-size:1.55rem;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.bn p{margin:.4rem 0 0;color:var(--text);font-weight:600}
.bn .big{font-family:var(--display);font-weight:900;font-size:2.8rem;color:#ffe28a;text-shadow:0 2px 0 #7a4b08,0 0 22px rgba(255,200,80,.9);line-height:1}
.bn .ic{font-size:3.4rem;line-height:1;filter:drop-shadow(0 0 16px rgba(255,210,90,.9));animation:icPop .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes icPop{from{transform:scale(.2) rotate(-30deg)}}
.bn .avb{width:68px;height:68px;border-radius:50%;margin:0 auto .5rem;overflow:hidden;border:3px solid var(--c,#ffd98a);box-shadow:0 0 24px rgba(255,200,90,.5)}
.bn .avb svg{width:100%;height:100%;display:block}
.count{font-family:var(--display);font-weight:900;font-size:7rem;line-height:1;color:#fff3c9;text-shadow:0 4px 0 #8a5a10,0 0 40px rgba(255,200,80,.9);animation:countPop .9s ease-out both}

  select() { return { ok: true }; }

}

  },
  serfinal() {

(function boot() {
